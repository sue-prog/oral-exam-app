<h1>Oral Exam Prep</h1>
<h1 style="color:red">DEPLOY TEST 123</h1>

<button id="generate">Generate Question</button>

<pre id="output"></pre>

<script>
  document.getElementById("generate").addEventListener("click", async () => {
    const res = await fetch("/oral-exam", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: "Give me an oral exam question." })
    });

    const data = await res.json();
    document.getElementById("output").textContent =
      data.result?.response || JSON.stringify(data, null, 2);
  });
</script>
